<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Visualização Dinâmica - Brasileirão</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="js/confrontos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="css/style.css">
  <style type="text/tailwindcss">
    @theme {
      --color-green: #04aa6d;
    }
  </style>
</head>

<body>
  <div class="w-full h-screen">
    <ul class="flex align-center justify-start">
      <li><a href="index.html">Geral</a></li>
      <li><a href="individual.html">Individual</a></li>
      <li><a class="active" href="confrontos.html">Confrontos Diretos</a></li>
      <li class="mx-auto flex items-center justify-center gap-2">
        <h1 class="text-2xl font-bold text-green">Confrontos Diretos</h1>
      </li>
      <li class="ml-auto"><a class="active" href="sobre.html">Sobre</a></li>
    </ul>

    <div class="w-11/12 mx-auto my-10">
      <div class="flex flex-wrap gap-4 mb-4 items-center">
        <div class="flex flex-col">
          <label for="time1-select" class="font-bold text-green">Clube 1</label>
          <select id="time1-select"
            class="py-2 bg-green rounded-sm text-white drop-shadow-md w-32 !outline-none"></select>
        </div>

        <div class="flex flex-col">
          <label for="time2-select" class="font-bold text-green">Clube 2</label>
          <select id="time2-select"
            class="py-2 bg-green rounded-sm text-white drop-shadow-md w-32 !outline-none"></select>
        </div>

        <div class="flex flex-col">
          <label class="invisible">.</label>
          <button id="attbtn"
            class="bg-green text-white py-2 px-4 rounded-sm shadow-md hover:opacity-90 transition">Pesquisar</button>
        </div>
      </div>

      <div class="flex flex-wrap gap-y-10 align-center justify-center">
        <div id="chart" class="flex-1/2"></div>
        <div id="chart2" class="flex-1/2"></div>
        <div id="chart3" class="flex-1/2"></div>
        <div id="chart4" class="flex-1/2 max-h-[450px] overflow-hidden"></div>
      </div>
    </div>
  </div>
</body>

</html>
